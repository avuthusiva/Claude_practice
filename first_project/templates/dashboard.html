<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Inspector - Database Dashboard</title>
    <style>
        :root {
            --bg-color: #1a202c;
            --text-color: #e2e8f0;
            --container-bg: #2d3748;
            --border-color: #4a5568;
            --th-color: #a0aec0;
            --td-color: #e2e8f0;
            --accent-color: #63b3ed;
            --badge-bg: #4a5568;
            --shadow: rgba(0, 0, 0, 0.5);
            --card-bg: #2d3748;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: var(--bg-color);
        }
        .container {
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px var(--shadow);
        }
        h1, h2 {
            color: var(--text-color);
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { color: var(--accent-color); text-decoration: none; font-weight: 600; }
        .nav-links a:hover { text-decoration: underline; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--th-color); text-transform: uppercase; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: var(--accent-color); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--th-color); font-weight: 600; background-color: rgba(0,0,0,0.1); }
        .badge { background: var(--badge-bg); color: var(--text-color); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="index.html">&larr; Back to File Inspector</a>
            <a href="logs.html">View Raw Logs</a>
        </div>
        <h1>Database Dashboard</h1>
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Files</h3><div class="value" id="statFiles">0</div></div>
            <div class="stat-card"><h3>Total Words</h3><div class="value" id="statWords">0</div></div>
            <div class="stat-card"><h3>Total Characters</h3><div class="value" id="statChars">0</div></div>
        </div>
        <h2>Recent File Logs</h2>
        <table>
            <thead>
                <tr>
                    <th>File Name</th>
                    <th>Format</th>
                    <th>Size</th>
                    <th>Uploaded At</th>
                </tr>
            </thead>
            <tbody id="logsBody">
                <tr><td colspan="4">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        fetch('/logs')
            .then(res => res.json())
            .then(data => {
                const logs = data.logs;
                document.getElementById('statFiles').textContent = data.count;
                let w = 0, c = 0;
                logs.forEach(l => { w += (l.word_count || 0); c += (l.character_count || 0); });
                document.getElementById('statWords').textContent = w.toLocaleString();
                document.getElementById('statChars').textContent = c.toLocaleString();

                const tbody = document.getElementById('logsBody');
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No logs found.</td></tr>';
                } else {
                    tbody.innerHTML = logs.map(l => `
                        <tr>
                            <td>${l.file_name}</td>
                            <td><span class="badge">${l.format_type || l.file_extension}</span></td>
                            <td>${(l.file_size/1024).toFixed(2)} KB</td>
                            <td>${l.upload_timestamp}</td>
                        </tr>
                    `).join('');
                }
            })
            .catch(err => {
                document.getElementById('logsBody').innerHTML = '<tr><td colspan="4">Error loading data.</td></tr>';
            });
    </script>
</body>
</html>
